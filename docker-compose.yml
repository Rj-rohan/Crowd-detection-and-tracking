version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:6.0
    container_name: crowd-detection-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-changeme123}
      MONGO_INITDB_DATABASE: crowd_detection
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
      - ./mongodb/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    networks:
      - crowd-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    image: rjrohan/crowd-detection-backend:latest
    container_name: crowd-detection-backend
    restart: unless-stopped
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - MONGO_URI=mongodb://admin:${MONGO_PASSWORD:-changeme123}@mongodb:27017/crowd_detection?authSource=admin
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID:-disabled}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:-disabled}
      - TWILIO_WHATSAPP_FROM=${TWILIO_WHATSAPP_FROM:-disabled}
      - TWILIO_WHATSAPP_TO=${TWILIO_WHATSAPP_TO:-disabled}
      - FLASK_ENV=production
    ports:
      - "5000:5000"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - crowd-network
    volumes:
      - ./backend/yolov8x.pt:/app/yolov8x.pt:ro
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G

  # Frontend
  frontend:
    image: rjrohan/crowd-detection-frontend:latest
    container_name: crowd-detection-frontend
    restart: unless-stopped
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - crowd-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

networks:
  crowd-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
